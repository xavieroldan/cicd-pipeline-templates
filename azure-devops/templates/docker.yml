# Job template: build a Docker image and optionally push it to a registry service connection.
parameters:
  - name: imageName
    type: string
  - name: dockerfile
    type: string
  - name: buildContext
    type: string
  - name: containerRegistry
    type: string
    default: ""
  - name: push
    type: boolean
    default: false
  - name: dependsOn
    type: object
    default: []

jobs:
  - job: docker_${{ replace(parameters.imageName, '-', '_') }}
    displayName: Docker image ${{ parameters.imageName }}
    dependsOn: ${{ parameters.dependsOn }}
    pool:
      vmImage: ubuntu-latest
    steps:
      - ${{ if eq(parameters.push, true) }}:
          - task: Docker@2
            displayName: Build and push
            inputs:
              command: buildAndPush
              containerRegistry: ${{ parameters.containerRegistry }}
              repository: ${{ parameters.imageName }}
              Dockerfile: ${{ parameters.dockerfile }}
              buildContext: ${{ parameters.buildContext }}
              tags: |
                $(Build.SourceVersion)
                latest
      - ${{ else }}:
          - task: Docker@2
            displayName: Build
            inputs:
              command: build
              repository: ${{ parameters.imageName }}
              Dockerfile: ${{ parameters.dockerfile }}
              buildContext: ${{ parameters.buildContext }}
              tags: $(Build.SourceVersion)
