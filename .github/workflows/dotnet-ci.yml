# Reusable workflow: restore, build and test a .NET solution or project.
name: .NET CI (reusable)

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the .sln or .csproj to build and test
        type: string
        required: true
      dotnet-version:
        description: .NET SDK version
        type: string
        default: "8.0.x"
      configuration:
        description: Build configuration
        type: string
        default: Release
      working-directory:
        description: Directory where commands run
        type: string
        default: "."

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "${{ inputs.project-path }}"

      - name: Build
        run: dotnet build "${{ inputs.project-path }}" -c ${{ inputs.configuration }} --no-restore

      - name: Test with coverage
        run: >
          dotnet test "${{ inputs.project-path }}" -c ${{ inputs.configuration }} --no-build
          --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/test-results"
          --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ${{ github.workspace }}/test-results
          if-no-files-found: ignore
